# Configuración del flujo simplificado. Las rutas de salida son fijas.
# Los TOML anteriores se conservan durante la transición del menú.

[shiller]
# Excel publicado en https://shillerdata.com/ el 17/10/2026.
url = "https://img1.wsimg.com/blobby/go/e5e77e0b-59d1-44d9-ab25-4763ac982e53/downloads/1449043e-a1ed-4e2e-8e9c-7b9a2a064493/ie_data.xls?ver=1791297298731"
history_start = "1926-01"

[validation]
development_start = "1927-01-01"
development_end = "1989-12-31"
final_test_start = "1990-01-01"
# Evaluación deshabilitada hasta definir el protocolo y la fecha de corte.
final_test_end = "pending"

[signals]
# Se mantienen las reglas implementadas; no son parámetros para optimizar.
basis = "monthly_mean_price"
momentum_non_positive = "cash"

[spy]
# Trabajo previo con el ETF, separado del estudio mensual de Shiller.
# No se unen ambas series ni se entrena un modelo sobre estos datos.
start = "1993-01-29"
end = "2021-01-01" # Fin exclusivo: última sesión solicitada en 2020.
