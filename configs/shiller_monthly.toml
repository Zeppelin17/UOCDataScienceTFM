[source]
provider = "shiller"
instrument = "SHILLER_SP_COMPOSITE"
frequency = "monthly"
# Enlace del Excel publicado en https://shillerdata.com/ el 17/10/2026.
url = "https://img1.wsimg.com/blobby/go/e5e77e0b-59d1-44d9-ab25-4763ac982e53/downloads/1449043e-a1ed-4e2e-8e9c-7b9a2a064493/ie_data.xls?ver=1791297298731"
timeout = 30

[preparation]
# Historia previa; no se incluye como muestra de desarrollo del modelo.
history_start = "1926-01"

[validation]
policy_config = "configs/historical_policy.toml"

[storage]
raw = "data/raw"
processed = "data/processed"
