# Primera fuente propuesta. Véase docs/data_sources.md.
[market]
instrument = "SPY"
provider = "yahoo"
frequency = "daily"
start = "1993-01-29"
# Yahoo/yfinance interpreta end como EXCLUSIVO.
end = "2021-01-01"

[download]
interval = "1d"
auto_adjust = false
back_adjust = false
actions = true
repair = false
keepna = true
rounding = false
prepost = false
# Evitar variaciones implícitas de estructura y paralelismo.
threads = false
multi_level_index = false
ignore_tz = true
timeout = 30

[storage]
raw = "data/raw"
processed = "data/processed"
datasets = "data/datasets"
