[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uoc-data-science-tfm"
version = "0.1.0"
description = "Investigación reproducible de filtros de señales sobre el S&P 500"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3,<4",
    "pyarrow>=22,<24",
    "yfinance>=1.4,<2",
    "exchange-calendars>=4.11,<5",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
